services:
    backend:
        build: ./server
        container_name: davlibri-backend
        restart: unless-stopped
        env_file:
            - ./server/.env
        ports:
            - '3000:3000'

    frontend:
        build:
            context: ./client
            args:
                VITE_API_URL: ${VITE_API_URL:-https://api-davlibri.davit.io.vn}
                # Must match SECRET_CRYPTO in server/.env, otherwise login succeeds but the frontend can't decrypt the user payload
                VITE_SECRET_CRYPTO: ${VITE_SECRET_CRYPTO:-123456}
        container_name: davlibri-frontend
        restart: unless-stopped
        ports:
            - '5173:80'
        depends_on:
            - backend

networks:
    default:
        name: web_network
        external: true
